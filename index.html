<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Store Operations Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f6f7;--sf:#fff;--tx:#1d1d1f;--mu:#6e6e73;--bd:#e3e3e6;--ac:#0071e3;--ok:#1a7f37;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--sf:#1c1c1f;--tx:#f5f5f7;--mu:#98989d;--bd:#2e2e32;--ac:#4aa3ff;--ok:#5fd07a;--bad:#ff7b72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111113;--sf:#1c1c1f;--tx:#f5f5f7;--mu:#98989d;--bd:#2e2e32;--ac:#4aa3ff;--ok:#5fd07a;--bad:#ff7b72;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--sf);border-right:1px solid var(--bd);padding:16px 10px;overflow-y:auto;z-index:20;transition:transform .2s}
#main{margin-left:236px;padding:24px;max-width:1100px}
#top{display:none;position:sticky;top:0;background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 14px;z-index:10;align-items:center;gap:10px}
.nav{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit}
.nav:hover{background:var(--bg)}.nav.on{background:var(--ac);color:#fff}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:14px 10px 4px}
a.nav{text-decoration:none}
h1{font-size:22px;margin:0 0 16px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi b{font-size:26px;display:block}.kpi span{color:var(--mu);font-size:12px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--ac)}
input,select,textarea,button.b{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);max-width:100%}
button.b{cursor:pointer;background:var(--ac);color:#fff;border:0}button.b.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}.f input,.f select,.f textarea{width:100%}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--mu)}
.badge{display:inline-block;min-width:26px;text-align:center;padding:2px 8px;border-radius:12px;font-weight:600;font-size:12px}
.P{background:#d6ebff;color:#0b4a8a}.M{background:#e0dcff;color:#3b2fa0}.S{background:#ffe3b8;color:#8a4b00}.X{background:#e5e5e8;color:#555}
.warn{color:var(--bad)}.ok{color:var(--ok)}.mu{color:var(--mu)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chk{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
@media(max-width:800px){#side{transform:translateX(-100%)}#side.open{transform:none}#main{margin-left:0;padding:14px}#top{display:flex}}
@media print{#side,#top,.np{display:none!important}#main{margin:0;padding:0;max-width:none}body{background:#fff;color:#000}.card{border:0;padding:0}.chk{color:#000}}
.cl-h{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.tabs2{display:flex;gap:6px;margin:10px 0}.tabs2 button{flex:1}
.mx td,.mx th{text-align:center;padding:6px 4px;white-space:normal;font-size:12px}.mx td:first-child,.mx th:first-child{text-align:left;white-space:nowrap}
.cb{min-width:38px;padding:4px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--mu);font-weight:600;font-size:12px;cursor:pointer}
.cb.ok{background:rgba(47,122,77,.18);border-color:#2f7a4d;color:var(--ok)}.cb.no{background:rgba(198,40,40,.15);border-color:var(--bad);color:var(--bad)}
.it{display:grid;grid-template-columns:28px 1fr 96px;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.it .tg{display:flex;flex-direction:column;gap:5px}.hid{display:none}
@media(max-width:800px){.cl-h{grid-template-columns:1fr}}
@media print{html:root{--bg:#fff!important;--sf:#fff!important;--tx:#000!important;--mu:#333!important;--bd:#999!important}.hid{display:block!important}.cl-sec{break-before:page}.cl-sec:first-of-type{break-before:auto}.it{break-inside:avoid}.cb,.it{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
body{background:radial-gradient(1100px 480px at 90% -10%,rgba(0,113,227,.09),transparent),var(--bg)}
#side{box-shadow:2px 0 24px rgba(0,0,0,.04)}
.brand{padding:14px;border-radius:14px;background:linear-gradient(135deg,#0b1f3a,#0071e3 70%,#5e5ce6);color:#fff;margin-bottom:6px}.brand b{display:block;font-size:15px;line-height:1.25}.brand small{opacity:.85;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;transition:.15s}.nav .ic{width:22px;text-align:center}
.nav.on{background:linear-gradient(135deg,#0071e3,#5e5ce6);box-shadow:0 4px 12px rgba(0,113,227,.3)}
.card{border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)}
h1{font-size:26px;letter-spacing:-.02em}
.hero{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;color:var(--mu);font-size:13px}.hero b{color:var(--tx)}
.kpi{position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--k,var(--ac))}.kpi .ico{font-size:22px}.kpi b{font-size:34px;letter-spacing:-.02em;line-height:1.2}
.bar{height:10px}.bar i{background:linear-gradient(90deg,#0071e3,#5e5ce6);border-radius:6px}
tr:hover td{background:rgba(0,113,227,.05)}
button.b{border-radius:10px;font-weight:600;transition:.15s;box-shadow:0 2px 8px rgba(0,113,227,.25)}button.b.g{box-shadow:none}button.b:hover{filter:brightness(1.08);transform:translateY(-1px)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
</style></head><body>
<div id="top"><button class="b g" onclick="document.getElementById('side').classList.toggle('open')">☰</button><b id="tt">Store Dashboard</b></div>
<nav id="side"></nav><main id="main"></main>
<script>
const DAYS=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'],SL=['13:00','15:00','18:00'],CATS={ap:'AirPods',ip:'iPad',aw:'Apple Watch',mb:'MacBook'};
const EXC=['spv','cashier','kasir','store trainer'];
const LINKS=[['Open Studio (submit link)','https://forms.gle/mfseNo9aRQmVnSBd8'],['Try-on AirPods','https://docs.google.com/forms/d/e/1FAIpQLSdDj3fPWA5_tZ7xBcjEhb8hMn0DAQ5Ok_joASUjwStYUjC5Ow/viewform'],['Try-on iPad','https://forms.gle/BZphsLuhdCtF71J1A'],['Try-on MacBook','https://forms.gle/J8y1P5upj3iAVM4S6']];
const CHK=['Lantai area penjualan disapu &amp; dipel','Meja display Apple dilap bersih','Layar demo unit dibersihkan','Kaca &amp; pintu masuk dibersihkan','Area Open Studio rapi','Area kasir &amp; counter bersih','Tempat sampah dikosongkan','Toilet &amp; pantry bersih','Area gudang rapi','Alat kebersihan disimpan'];
const iso=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const wk=()=>{const m=new Date();m.setDate(m.getDate()-(m.getDay()+6)%7);return[...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return iso(d)})};
const TODAY=iso(new Date()),TI=(new Date().getDay()+6)%7;
let ADM=false,page='dash',S;
function init(){const r=(n,ro,c)=>({n,r:ro,c:c.split('')});return{staff:[r('Rina','SPV','PPPPPXX'),r('Dewi','Store Trainer','PPPPPMX'),r('Sari','Cashier','MMMMMSX'),r('Andi','Staff','PPMMSSX'),r('Budi','Staff','MMSSXPP'),r('Citra','Staff','SSXPPMM'),r('Dika','Staff','XPPMMSS'),r('Eko','Staff','PMSXPMS')],acts:[],ops:{},mode:'auto',quota:{os:1,ap:2,ip:1,aw:1,mb:1},manual:{os:20,ap:30,ip:15,aw:15,mb:15},coach:{},chk:{},cash:{}}}
try{S=JSON.parse(localStorage.getItem('sod'))||init()}catch(e){S=init()}
const save=()=>{try{localStorage.setItem('sod',JSON.stringify(S))}catch(e){}};
const elig=s=>!EXC.some(x=>s.r.toLowerCase().includes(x));
const cnt=(f)=>S.acts.filter(a=>wk().includes(a.date)&&(!f||f(a)));
const sc=s=>({os:cnt(a=>a.staff==s.n&&a.type=='os').length,to:cnt(a=>a.staff==s.n&&a.type=='to').length});
const tot=()=>S.staff.reduce((n,s)=>n+s.c.filter(c=>'PMS'.includes(c)).length,0);
const tgt=k=>S.mode=='auto'?tot()*S.quota[k]:+S.manual[k];
const bar=(l,v,t)=>`<div class="row" style="justify-content:space-between"><span>${l}</span><span class="mu">${v} / ${t} (${t?Math.min(100,Math.round(v/t*100)):0}%)</span></div><div class="bar"><i style="width:${t?Math.min(100,v/t*100):0}%"></i></div>`;
const adm=cb=>{if(ADM){cb&&cb();return true}askPw(cb);return false};
function askPw(cb){const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:99';m.innerHTML='<div class="card f" style="width:300px;margin:0"><h2>Password Admin</h2><input id="pwi" type="password" placeholder="Password"><p id="pwe" class="warn" style="margin:6px 0"></p><div class="row"><button class="b" id="pwo">Masuk</button><button class="b g" id="pwc">Batal</button></div></div>';document.body.appendChild(m);const i=document.getElementById('pwi');i.focus();const ok=()=>{if(i.value==='Admin00'){ADM=true;m.remove();cb&&cb()}else document.getElementById('pwe').textContent='Password salah'};document.getElementById('pwo').onclick=ok;i.onkeydown=e=>{if(e.key==='Enter')ok()};document.getElementById('pwc').onclick=()=>{m.remove();go(page)}}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99';document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
const badge=c=>`<span class="badge ${c}">${c}</span>`;
const rank=()=>S.staff.filter(elig).map(s=>({...s,...sc(s)})).map(s=>({...s,t:s.os+s.to})).sort((a,b)=>b.t-a.t||b.os-a.os);
const PG={
dash(){const k=[['Open Studio',cnt(a=>a.type=='os').length,'os']].concat(Object.entries(CATS).map(([k,v])=>['Try-on '+v,cnt(a=>a.cat==k).length,k]));
const ina=S.staff.filter(s=>elig(s)&&'PMS'.includes(s.c[TI])&&!S.acts.some(a=>a.date==TODAY&&a.staff==s.n));
return`<h1>Dashboard Overview</h1><div class="grid">${k.map(x=>`<div class="card kpi" style="--k:${KC[x[2]]}"><div class="ico">${KI[x[2]]}</div><b>${x[1]}</b><span>${x[0]} · minggu ini</span></div>`).join('')}</div>
<div class="card"><h2>Pencapaian target mingguan (${S.mode=='auto'?'otomatis dari jadwal':'manual'})</h2>${k.map(x=>bar(x[0],x[1],tgt(x[2]))).join('')}</div>
<div class="card"><h2>Staff belum beraktivitas hari ini</h2>${ina.length?ina.map(s=>`<div class="warn">⚠ ${s.n} <span class="mu">· shift ${s.c[TI]}</span></div>`).join(''):'<span class="ok">Semua staff yang masuk sudah beraktivitas ✓</span>'}</div>`},
input(){const on=S.staff.filter(s=>'PMS'.includes(s.c[TI]));return`<h1>Input Aktivitas</h1><div class="card f" style="max-width:520px"><label>Tanggal</label><input type="date" id="d" value="${TODAY}" onchange="fillN()"><label>Nama staff</label><select id="n"></select><label>Jenis aktivitas</label><select id="t" onchange="tg()"><option value="os">Open Studio</option><option value="to">Try-on Produk</option></select>
<div id="o"><label>Topik / materi</label><input id="tp"><label>Jumlah peserta</label><input id="px" type="number" min="0" value="1"></div>
<div id="r" hidden><label>Kategori produk</label><select id="c">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><label>Respons customer</label><textarea id="nt" rows="2"></textarea></div><p><button class="b" onclick="addA()">Simpan</button></p></div>
<div class="card"><h2>Riwayat input terbaru</h2><div class="tw"><table><tr><th>Tanggal<th>Staff<th>Aktivitas<th>Detail</tr>${S.acts.slice(-15).reverse().map(a=>`<tr><td>${a.date}<td>${a.staff}<td>${a.type=='os'?'Open Studio':'Try-on '+CATS[a.cat]}<td>${a.type=='os'?a.topic+' ('+a.px+' peserta)':a.note||''}</tr>`).join('')}</table></div></div>`},
sched(){const el=S.staff.filter(elig);return`<h1>Jadwal Mingguan</h1><div class="card"><p class="mu np">Upload jadwal (.xls) dilakukan di menu Admin.</p><div class="tw"><table><tr><th>Nama<th>Jabatan${DAYS.map(d=>'<th>'+d.slice(0,3)).join('')}<th>Hari kerja</tr>${S.staff.map(s=>`<tr><td>${s.n}<td class="mu">${s.r}${s.c.map(c=>'<td>'+badge(c)).join('')}<td><b>${s.c.filter(c=>'PMS'.includes(c)).length}</b></tr>`).join('')}</table></div></div>
<div class="card"><h2>Jadwal Open Studio</h2><p class="mu">Tidak termasuk SPV, Cashier, Store Trainer. Perubahan butuh password admin.</p><div class="row"><button class="b" onclick="auto()">Auto-acak 1 minggu</button><button class="b g" onclick="clr()">Kosongkan</button><button class="b g" onclick="waOps()">Copy format WhatsApp</button></div><div class="tw"><table><tr><th>Hari${SL.map(s=>'<th>'+s).join('')}</tr>${DAYS.map((d,i)=>`<tr><td>${d}${i==TI?' •':''}${SL.map((s,j)=>{const v=(S.ops[i]||{})[j]||'';const e=el.filter(x=>['P','PMS','MS'][j].includes(x.c[i]));return`<td><select onchange="setOp(${i},${j},this.value)"><option value="">—</option><option value="HO" ${v=='HO'?'selected':''}>Training HO</option>${e.map(x=>`<option ${v==x.n?'selected':''}>${x.n}</option>`).join('')}</select>`}).join('')}</tr>`).join('')}</table></div></div>`},
perf(){const r=rank();const top=[...r].sort((a,b)=>b.os-a.os).slice(0,3),tt=[...r].sort((a,b)=>b.to-a.to).slice(0,3),low=[...r].sort((a,b)=>a.t-b.t).slice(0,3);
const L=(a,k)=>a.map((s,i)=>`<div>${i+1}. ${s.n} <b>${s[k]}</b></div>`).join('');
return`<h1>Staff Performance</h1><div class="grid"><div class="card"><h2>Open Studio terbanyak</h2>${L(top,'os')}</div><div class="card"><h2>Try-on terbanyak</h2>${L(tt,'to')}</div><div class="card"><h2>Under perform</h2><p class="mu">Total aktivitas paling sedikit</p>${L(low,'t')}</div></div><p><button class="b" onclick="waPerf()">Copy format WhatsApp</button></p><p class="mu">Data minggu berjalan. SPV, Cashier, dan Store Trainer dikecualikan.</p>`},
mon(){const r=rank(),z=r.filter(s=>s.os==0&&s.to==0&&s.c.some(c=>'PMS'.includes(c))),
rec=r.filter(s=>s.t<=Math.max(1,Math.floor(r.reduce((a,b)=>a+b.t,0)/(r.length||1)/2)));
return`<h1>Monitoring Aktivitas</h1><p><button class="b" onclick="waMon()">Copy format WhatsApp</button></p><div class="card"><h2>Tanpa kontribusi Open Studio &amp; Try-on (minggu ini)</h2>${z.length?z.map(s=>`<div class="warn">⚠ ${s.n}</div>`).join(''):'<span class="ok">Semua staff sudah berkontribusi ✓</span>'}</div>
<div class="card"><h2>Ranking mingguan</h2><div class="tw"><table><tr><th>#<th>Nama<th>Open Studio<th>Try-on<th>Total<th>Hari kerja</tr>${r.map((s,i)=>`<tr><td>${i+1}<td>${s.n}<td>${s.os}<td>${s.to}<td><b>${s.t}</b><td>${s.c.filter(c=>'PMS'.includes(c)).length}</tr>`).join('')}</table></div></div>
<div class="card"><h2>Rekomendasi improve</h2>${rec.map(s=>`<div>• <b>${s.n}</b>: ${s.os==0?'jadwalkan Open Studio, ':''}${s.to==0?'targetkan minimal 1 Try-on per shift, ':''}pantau tiap akhir shift.</div>`).join('')||'<span class="ok">Tidak ada rekomendasi khusus.</span>'}</div>`},
coach(){return`<h1>Sales Coach Progress</h1><p><button class="b" onclick="waCoach()">Copy format WhatsApp</button></p><div class="card tw"><table><tr><th>Nama<th>Level Sales Coach<th>Status</tr>${S.staff.map((s,i)=>{const c=S.coach[s.n]||{};return`<tr><td>${s.n}<td><input value="${c.l||''}" placeholder="mis. 12" onchange="cch(${i},'l',this.value)"><td><select onchange="cch(${i},'s',this.value)">${['Member','Apple Champion Candidate','Apple Champion','Apple Champion +'].map(o=>`<option ${c.s==o?'selected':''}>${o}</option>`).join('')}</select></tr>`}).join('')}</table></div>`},
check(){const c=S.chk[TODAY]||{};return`<h1>Daily Checklist Kebersihan</h1><div class="card"><p>Tanggal: <b>${TODAY}</b></p>${CHK.map((t,i)=>`<label class="chk" style="margin:0;color:var(--tx);font-size:14px"><input type="checkbox" ${c[i]?'checked':''} onchange="ck(${i},this.checked)"> ${t}</label>`).join('')}<p style="margin-top:28px">Petugas: ________________ &nbsp; Paraf SPV: ________________</p><div class="row np"><button class="b" onclick="print()">Cetak / Simpan PDF</button></div></div>`},
cash(){const t=cnt=>S.acts.filter(a=>a.date==TODAY&&a.type==cnt),os=t('os').length,to=t('to'),by=Object.entries(CATS).map(([k,v])=>v+': '+to.filter(a=>a.cat==k).length);
return`<h1>Laporan Kasir</h1><div class="card"><div class="grid"><div class="kpi"><b>${os}</b><span>Open Studio hari ini</span></div><div class="kpi"><b>${to.length}</b><span>Try-on hari ini</span></div></div><p class="mu">${by.join(' · ')}</p><label>Catatan serah terima</label><textarea id="hn" rows="3" style="width:100%" onchange="S.cash[TODAY]=this.value;save()">${S.cash[TODAY]||''}</textarea><p><button class="b" onclick="wa()">Copy format WhatsApp</button></p></div>`},
admin(){if(!ADM)return`<h1>Admin</h1><div class="card"><p>Halaman ini butuh password.</p><button class="b" onclick="adm(()=>go('admin'))">Masuk</button></div>`;
return`<h1>Admin</h1><div class="card f" style="max-width:520px"><h2>Identitas toko</h2><label>Nama toko</label><input value="${esc(S.store.name)}" onchange="S.store.name=this.value;save();go('admin')"><label>Konsep toko</label><input value="${esc(S.store.concept)}" onchange="S.store.concept=this.value;save();go('admin')"><p class="mu">Contoh: Digimap Grand Indonesia · Apple Premium Partner</p></div><div class="card f" style="max-width:520px"><h2>Pengaturan target</h2><label>Mode</label><select onchange="S.mode=this.value;save();go('admin')"><option value="auto" ${S.mode=='auto'?'selected':''}>Otomatis (shift aktif × kuota harian)</option><option value="manual" ${S.mode=='manual'?'selected':''}>Manual</option></select>
${['os','ap','ip','aw','mb'].map(k=>`<label>${k=='os'?'Open Studio':CATS[k]} — ${S.mode=='auto'?'kuota per shift':'target mingguan toko'}</label><input type="number" min="0" value="${S.mode=='auto'?S.quota[k]:S.manual[k]}" onchange="S.${S.mode=='auto'?'quota':'manual'}.${k}=+this.value;save()">`).join('')}</div>
<div class="card"><h2>Upload jadwal mingguan (.xls)</h2><p class="mu">Kolom: Nama, Jabatan, Senin–Minggu. Isi kode P / M / S / X. Format .xls, .xlsx, dan .csv didukung.</p><div class="row"><button class="b" onclick="document.getElementById('xf').click()">Pilih file jadwal</button><button class="b g" onclick="tpl()">Unduh template (.xls)</button><input id="xf" type="file" accept=".xls,.xlsx,.csv" hidden onchange="imp(this)"></div><p class="mu">Jadwal saat ini: ${S.staff.length} staff</p></div><div class="card row"><button class="b" onclick="exp()">Export aktivitas ke Excel</button><button class="b g" onclick="if(this.dataset.s){localStorage.removeItem('sod');location.reload()}else{this.dataset.s=1;this.textContent='Klik lagi untuk konfirmasi hapus'}">Reset data</button></div>`}};
const NAV=[['dash','Dashboard Overview'],['input','Input Aktivitas'],['sched','Jadwal Mingguan'],['perf','Staff Performance'],['mon','Monitoring Aktivitas'],['coach','Sales Coach Progress'],['check','Daily Checklist Kebersihan'],['cash','Laporan Kasir'],['admin','Admin 🔒']];
function go(p){page=p;document.getElementById('side').classList.remove('open');document.getElementById('side').innerHTML='<div class="brand"><b>'+esc(S.store.name)+'</b><small>'+esc(S.store.concept)+'</small></div><div class="lbl">Menu</div>'+NAV.map(n=>`<button class="nav ${n[0]==p?'on':''}" onclick="go('${n[0]}')"><span class="ic">${IC[n[0]]}</span>${n[1]}</button>`).join('')+'<div class="lbl">Form &amp; Survey</div>'+LINKS.map(l=>`<a class="nav" target="_blank" rel="noopener" href="${l[1]}">${l[0]} ↗</a>`).join('')+'<span class="nav mu">Try-on Apple Watch: segera hadir</span>';
document.title=S.store.name+' Dashboard';document.getElementById('tt').textContent=S.store.name;document.getElementById('main').innerHTML='<div class="hero np"><span><b>'+esc(S.store.name)+'</b> · '+esc(S.store.concept)+'</span><span>'+new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</span></div>'+PG[p]();if(p=='input'){fillN();tg()}}
function fillN(){const i=S.staff.findIndex?0:0,d=document.getElementById('d').value,x=(new Date(d).getDay()+6)%7,w=wk().includes(d);document.getElementById('n').innerHTML=S.staff.filter(s=>!w||'PMS'.includes(s.c[x])).map(s=>`<option>${s.n}</option>`).join('')}
function tg(){const t=document.getElementById('t').value=='os';o.hidden=!t;r.hidden=t}
function addA(){const t=document.getElementById('t').value,n=document.getElementById('n').value;if(!n)return toast('Pilih staff');
S.acts.push(t=='os'?{date:d.value,staff:n,type:'os',topic:tp.value,px:px.value}:{date:d.value,staff:n,type:'to',cat:c.value,note:nt.value});save();go('input')}
function setOp(i,j,v){if(!ADM)return adm(()=>setOp(i,j,v));(S.ops[i]=S.ops[i]||{})[j]=v;save()}
function auto(){if(!ADM)return adm(auto);const n={};S.staff.filter(elig).forEach(s=>n[s.n]=0);DAYS.forEach((d,i)=>{S.ops[i]=S.ops[i]||{};const used=[];SL.forEach((s,j)=>{if(S.ops[i][j]=='HO')return;const AL=['P','PMS','MS'][j];let e=S.staff.filter(x=>elig(x)&&AL.includes(x.c[i]));let p=e.filter(x=>!used.includes(x.n));if(!p.length)p=e;if(!p.length){S.ops[i][j]='';return}
p=p.map(x=>[x,Math.random()]).sort((a,b)=>n[a[0].n]-n[b[0].n]||a[1]-b[1]).map(x=>x[0]);S.ops[i][j]=p[0].n;used.push(p[0].n);n[p[0].n]++})});save();go('sched')}
function clr(){if(!ADM)return adm(clr);Object.keys(S.ops).forEach(i=>Object.keys(S.ops[i]).forEach(j=>{if(S.ops[i][j]!='HO')S.ops[i][j]=''}));save();go('sched')}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
const st=rows.slice(1).filter(r=>r[0]).map(r=>({n:String(r[0]).trim(),r:String(r[1]||'Staff').trim(),c:[...Array(7)].map((_,i)=>String(r[2+i]||'X').trim().toUpperCase().charAt(0)).map(c=>'PMSX'.includes(c)?c:'X')}));
if(!st.length)return toast('Format tidak dikenali');S.staff=st;save();go('admin');toast('Jadwal berhasil diupload: '+st.length+' staff')};r.readAsArrayBuffer(f)}
function tpl(){const ws=XLSX.utils.aoa_to_sheet([['Nama','Jabatan',...DAYS],['Andi','Staff','P','P','M','M','S','S','X'],['Rina','SPV','P','P','P','P','P','X','X']]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Jadwal');XLSX.writeFile(wb,'template_jadwal.xls',{bookType:'biff8'})}
function cch(i,k,v){const n=S.staff[i].n;S.coach[n]=S.coach[n]||{};S.coach[n][k]=v;save()}
function ck(i,v){(S.chk[TODAY]=S.chk[TODAY]||{})[i]=v;save()}
function wa(){const t=S.acts.filter(a=>a.date==TODAY),to=t.filter(a=>a.type=='to'),txt=`*Laporan Harian ${TODAY}*\nOpen Studio: ${t.length-to.length}\nTry-on: ${to.length}\n${Object.entries(CATS).map(([k,v])=>'- '+v+': '+to.filter(a=>a.cat==k).length).join('\n')}\nCatatan: ${S.cash[TODAY]||'-'}`;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Tersalin'),()=>toast('Gagal menyalin'))}
function exp(){const ws=XLSX.utils.json_to_sheet(S.acts.map(a=>({Tanggal:a.date,Staff:a.staff,Aktivitas:a.type=='os'?'Open Studio':'Try-on',Kategori:CATS[a.cat]||'',Topik:a.topic||'',Peserta:a.px||'',Catatan:a.note||''}))),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Aktivitas');XLSX.writeFile(wb,'laporan_aktivitas.xlsx')}
const CL_DEV=['iPhone','iPad','Macbook','Apple Watch','iMac'],CL_COL=[['dcota','DCOTA'],['internet','Internet speed 10 Mbps'],['version','Updated Version Unit Demo'],['charging','Charging'],['alarm','Alarm'],['battery','Battery >50%']];
const CL_IT=['Demo Unit terpasang dengan rapih dan juga bersih (tidak kotor / tidak ada sidik jari / rambut / tidak defect)','Price ticket tidak kotor / buram','Price ticket sudah benar / sesuai','Apple Pencil gen 1 selalu dicek, pastikan terconnect ke device-nya dan dicek berkala','Cek Magic Mouse dan juga Magic Keyboard iMac','Semua meja demo bersih dan tidak ada kerusakan','Harga unit promo pastikan sama dengan PL, PT, DC dan juga ETP','Easel dan juga acrylic A4 pastikan sesuai panduan','Semua lubang AC, rak kaca, kaca depan dan meja display pastikan bersih','Cable security pastikan bersih, rapih, dan berfungsi dengan baik','Acc terdisplay dengan rapih dan bersih sesuai guidelines','Tidak ada sarang laba-laba di tembok atau bawah meja','Logo Digimap dan Apple bersih dan lampu menyala semua','Graphic panel bersih dan tidak ada kotor','Lantai bersih dan tidak ada yang rusak','Cek kebersihan semua acrylic, jika berjamur diganti','Gudang pastikan bersih, tidak ada bekas makanan atau minuman','Meja kasir rapih dan bersih, termasuk acrylic POP','Di gudang, unit jual pastikan tersusun dengan rapih sesuai rak','Mading terupdate setiap pagi','Check O2O secara berkala (jam 10, jam 15, jam 19)','Cek grooming staff'];
const CL_SH=[['pagi','Pagi','Sebelum 10:00'],['siang','Siang','Sebelum 14:30']];
let CL=null,CLT='pagi',CLH=false;S.cl=S.cl||{};
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const clShift=()=>({m:Object.fromEntries(CL_DEV.map(d=>[d,{}])),mn:'',it:CL_IT.map(()=>({s:'',n:''})),pn:'',pt:''});
const clNew=()=>({store:S.store.name,date:TODAY,role:'',pagi:clShift(),siang:clShift()});
const clKeys=()=>Object.keys(S.cl).sort().reverse();
function clLoad(){if(!CL){const k=Object.keys(S.cl).filter(k=>k.startsWith(TODAY+'__'));CL=k.length==1?JSON.parse(JSON.stringify(S.cl[k[0]])):clNew()}}
const clR=()=>{const y=scrollY;go('check');scrollTo(0,y)};
function clProg(sh){let t=0,d=0,o=0,n=0;const D=CL[sh];CL_DEV.forEach(v=>CL_COL.forEach(c=>{t++;const x=D.m[v][c[0]];if(x){d++;x=='ok'?o++:n++}}));D.it.forEach(i=>{t++;if(i.s){d++;i.s=='ok'?o++:n++}});return{p:Math.round(d/t*100),o,n}}
function clC(sh,d,c){const m=CL[sh].m[d];m[c]=!m[c]?'ok':m[c]=='ok'?'no':'';clR()}
function clI(sh,i,s){const x=CL[sh].it[i];x.s=x.s==s?'':s;clR()}
function clT(t){CLT=t;clR()}
function clSave(){const k=CL.date+'__'+(CL.store||'toko');S.cl[k]=JSON.parse(JSON.stringify(CL));save();toast('Checklist tersimpan')}
function clL(i){CL=JSON.parse(JSON.stringify(S.cl[clKeys()[i]]));CLH=false;clR()}
function clD(i){delete S.cl[clKeys()[i]];save();clR()}
PG.check=function(){clLoad();const p=clProg(CLT),ks=clKeys();
const sec=s=>{const D=CL[s[0]];return`<div class="cl-sec ${CLT==s[0]?'':'hid'}"><div class="card"><h2>Checklist ${s[1]} · ${s[2]}</h2><div class="tw"><table class="mx"><tr><th>Unit Demo${CL_COL.map(c=>'<th>'+c[1]).join('')}</tr>${CL_DEV.map(d=>`<tr><td>${d}${CL_COL.map(c=>{const v=D.m[d][c[0]]||'';return`<td><button class="cb ${v}" onclick="clC('${s[0]}','${d}','${c[0]}')">${v=='ok'?'OK':v=='no'?'NO':'–'}</button>`}).join('')}</tr>`).join('')}</table></div><label>Catatan unit demo (defect, versi software, dsb.)</label><textarea rows="2" style="width:100%" oninput="CL.${s[0]}.mn=this.value">${esc(D.mn)}</textarea></div>
<div class="card"><h2>Pemeriksaan Area &amp; Display</h2>${CL_IT.map((t,i)=>{const x=D.it[i];return`<div class="it"><b class="mu">${i+2}</b><div>${t}${x.s=='no'?`<input style="width:100%;margin-top:6px" placeholder="Keterangan..." value="${esc(x.n)}" oninput="CL.${s[0]}.it[${i}].n=this.value">`:''}</div><div class="tg"><button class="cb ${x.s=='ok'?'ok':''}" onclick="clI('${s[0]}',${i},'ok')">OK</button><button class="cb ${x.s=='no'?'no':''}" onclick="clI('${s[0]}',${i},'no')">Bermasalah</button></div></div>`}).join('')}<div class="grid f" style="margin-top:12px"><div><label>Checklist oleh (nama)</label><input value="${esc(D.pn)}" oninput="CL.${s[0]}.pn=this.value"></div><div><label>Jam selesai</label><input type="time" value="${D.pt}" oninput="CL.${s[0]}.pt=this.value"></div></div></div></div>`};
return`<h1>Daily Checklist Store</h1><div class="card"><div class="cl-h f"><div><label>Nama Toko</label><input value="${esc(CL.store)}" placeholder="mis. Digimap – Mall X" oninput="CL.store=this.value"></div><div><label>Tanggal</label><input type="date" value="${CL.date}" onchange="CL.date=this.value"></div><div><label>Diperiksa oleh (jabatan)</label><input value="${esc(CL.role)}" placeholder="mis. Store Supervisor" oninput="CL.role=this.value"></div></div></div>
<div class="np"><div class="tabs2">${CL_SH.map(s=>`<button class="b ${CLT==s[0]?'':'g'}" onclick="clT('${s[0]}')"><b>${s[1]}</b><br><small>${s[2]}</small></button>`).join('')}</div><div class="card"><div class="bar"><i style="width:${p.p}%"></i></div><b>${p.p}%</b> selesai · ${p.o} OK · <span class="warn">${p.n} Bermasalah</span></div></div>
${CL_SH.map(sec).join('')}
<div class="card np row"><button class="b" onclick="clSave()">Simpan</button><button class="b g" onclick="CLH=!CLH;clR()">Riwayat</button><button class="b g" onclick="print()">Cetak / PDF</button><button class="b g" onclick="if(this.dataset.s){CL[CLT]=clShift();clR()}else{this.dataset.s=1;this.textContent='Klik lagi untuk reset'}">Reset shift ini</button></div>
${CLH?`<div class="card np"><h2>Riwayat</h2>${ks.length?ks.map((k,i)=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${S.cl[k].date} · ${esc(S.cl[k].store)||'(tanpa nama toko)'}</span><span><button class="b g" onclick="clL(${i})">Muat</button> <button class="b g" onclick="clD(${i})">Hapus</button></span></div>`).join(''):'<span class="mu">Belum ada riwayat.</span>'}</div>`:''}`};
function waCopy(t){const fb=()=>{const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:99';m.innerHTML='<div class="card f" style="width:340px;margin:0"><h2>Salin teks</h2><textarea id="wat" rows="10"></textarea><p class="row"><button class="b" id="wac">Tutup</button></p></div>';document.body.appendChild(m);const a=document.getElementById('wat');a.value=t;a.focus();a.select();document.getElementById('wac').onclick=()=>m.remove()};try{navigator.clipboard.writeText(t).then(()=>toast('Tersalin, siap ditempel di WhatsApp'),fb)}catch(e){fb()}}
const waOps=()=>waCopy('*Jadwal Open Studio Minggu Ini*\n'+DAYS.map((d,i)=>'\n*'+d+' '+wk()[i].slice(8)+'/'+wk()[i].slice(5,7)+'*\n'+SL.map((s,j)=>{const v=(S.ops[i]||{})[j];return s+' - '+(v=='HO'?'Training HO':v||'-')}).join('\n')).join('\n'));
function waPerf(){const r=rank(),f=(a,k)=>a.slice(0,3).map((s,i)=>(i+1)+'. '+s.n+' ('+s[k]+')').join('\n');waCopy('*Staff Performance Minggu Ini*\n\n*Open Studio terbanyak*\n'+f([...r].sort((a,b)=>b.os-a.os),'os')+'\n\n*Try-on terbanyak*\n'+f([...r].sort((a,b)=>b.to-a.to),'to')+'\n\n*Perlu ditingkatkan (aktivitas paling sedikit)*\n'+f([...r].sort((a,b)=>a.t-b.t),'t'))}
function waMon(){const r=rank(),z=r.filter(s=>s.os==0&&s.to==0&&s.c.some(c=>'PMS'.includes(c))),rec=r.filter(s=>s.t<=Math.max(1,Math.floor(r.reduce((a,b)=>a+b.t,0)/(r.length||1)/2)));waCopy('*Monitoring Aktivitas Minggu Ini*\n\n*Ranking*\n'+r.map((s,i)=>(i+1)+'. '+s.n+' - Open Studio '+s.os+', Try-on '+s.to+' (total '+s.t+')').join('\n')+'\n\n*Belum ada kontribusi Open Studio & Try-on*\n'+(z.length?z.map(s=>'- '+s.n).join('\n'):'- Tidak ada')+'\n\n*Perlu improve*\n'+(rec.length?rec.map(s=>'- '+s.n).join('\n'):'- Tidak ada'))}
function waCoach(){waCopy('*Sales Coach Progress*\n\n'+S.staff.map((s,i)=>{const c=S.coach[s.n]||{};return (i+1)+'. '+s.n+' - Level '+(c.l||'-')+' - '+(c.s||'Member')}).join('\n'))}
S.store=S.store||{name:'Digimap Grand Indonesia',concept:'Apple Premium Partner'};
const IC={dash:'📊',input:'✍️',sched:'🗓️',perf:'🏆',mon:'📈',coach:'🎓',check:'🧹',cash:'🧾',admin:'🔒'},KC={os:'#5e5ce6',ap:'#0071e3',ip:'#34c759',aw:'#ff9f0a',mb:'#ff375f'},KI={os:'🎤',ap:'🎧',ip:'📱',aw:'⌚',mb:'💻'};
go('dash');
